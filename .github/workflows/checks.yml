# The floor every push and pull request must clear, on the three systems the app ships for.
# It does not replace the E2E suite against the packaged app: that needs a real GPU, NDI and
# displays, and runs on the maintainer's machines before a release.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows runners convert line endings on checkout; the song and Bible readers are tested byte by byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # What the postinstall downloads (the media engine, up to 50 MB zipped per system),
      # pinned by URL and sha256 in this script, so its hash is the key.
      - uses: actions/cache@v6
        with:
          path: |
            resources/engine
          key: binaries-${{ runner.os }}-${{ hashFiles('scripts/fetch-binaries.ts') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The app opened once. A named import from a CommonJS package, or Electron without its binary, passes
      # typecheck, lint, Vitest and the build, and the app dies at launch (2026-11-15 audit, P4). Linux only for now
      # (Playwright adds --no-sandbox there); Windows and the Mac once it proves stable.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test tests/e2e/startup.spec.ts --reporter=line
        env:
          E2E_NO_FIXTURES: "1"
